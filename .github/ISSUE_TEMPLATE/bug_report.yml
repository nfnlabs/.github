name: Bug report
description: Something isn't working as expected
type: Bug
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps, in order.
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Attachments
      description: Screenshots, screen recordings or logs. Drag and drop files into this box.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Device and build details
      description: Optional. App version, device, OS or browser.
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        After creating the issue, set **Severity**, **Environment** and **Platform** in the sidebar.
